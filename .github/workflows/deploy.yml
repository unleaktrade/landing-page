name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Add CNAME
        run: echo "unleak.trade" > build/CNAME

      # No SPA fallback copy here: `npm run build` prerenders every public route
      # to its own HTML file (served with a 200) and writes a noindex 404.html
      # shell for dynamic routes. Copying index.html over it would break that.
      - name: Check prerendered pages
        run: test -f build/faq.html && test -f build/404.html && test -f build/sitemap.xml

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
